name = "weby-og"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# No route: weby.cash/wallet* belongs to the production wallet Worker
# (weby-wallet-pwa, ../wrangler.production.toml), which hands this Worker the
# card images and crawler requests through its OG_CARDS binding.
workers_dev = false

# No service bindings: this Worker never forwards. The spent check reads the
# wallet's public release config.
[vars]
WALLET_RUNTIME_CONFIG_URL = "https://weby.cash/wallet/runtime-config.json"

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = false
