# MAINNET STAGING deploy (Cloudflare Worker + static assets; Workers only, no containers).
# Separate Worker + IndexedDB name from dev. Ark on Bitcoin MAINNET via the default
# Arkade ASP (arkade.computer; we do NOT operate it). Webcash legs on mainnet
# webcash.org. The runtime-config validator allows Ark mainnet ONLY for the
# `staging` and `production` tiers; `development` stays blocked.
#
# Staging moves real value, so it carries the PRODUCTION trust set (audit C4):
# never the development Groth16 ceremony (reproducible from a public seed, so its
# proofs are forgeable), never public Open Relay TURN, never the development
# keyserver/referee/voucher/RGB. Until the production trust set is provisioned
# (MPC-ceremony VK fingerprints, managed TURN, production keyserver + referee +
# voucher + RGB endpoints and their pins), the REPLACE_ME values below make the
# boot refuse with a named error instead of running mainnet on development trust.
# `scripts/check-release-trust.mjs` (CI) rejects development trust roots here.
# Build with BASE_PATH=/wallet, nest output under staging-deploy/wallet/, then:
#   wrangler deploy --config wrangler.staging.toml
# Served at https://weby-wallet-pwa-staging.<account>.workers.dev/wallet (no DNS change).
name = "weby-wallet-pwa-staging"
main = "dev-worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
assets = { directory = "staging-deploy", binding = "ASSETS", run_worker_first = true }

[vars]
PUBLIC_BOOT_SCHEMA_VERSION = "2"
PUBLIC_DEPLOYMENT = "staging"
PUBLIC_EXTRO_DB_NAME = "extro-node-staging-mainnet"
PUBLIC_EXTRO_ADAPTER = "bundled"
PUBLIC_KEYSERVER_URL = "https://extro-keyserver-prod.harmoniis.workers.dev"
PUBLIC_KEYSERVER_DOMAIN = "extro-keyserver-prod.harmoniis.workers.dev"
PUBLIC_KEYSERVER_FINGERPRINT = "8eda29c36f1ae6140c146685f6fabf0f5ccf175e"
PUBLIC_KEYSERVER_VK = "67e9a4f8f05f502efb50feea97b8780df9dea92e49bcac146bb3580f4074abba"
PUBLIC_REFEREE_URL = "https://REPLACE_ME-production-referee"
PUBLIC_REFEREE_VK = "REPLACE_ME"
PUBLIC_WEBCASH_SERVER_URL = "https://webcash.org"
PUBLIC_VOUCHER_SERVER_URL = "https://webycash-voucher-prod.harmoniis.workers.dev"
PUBLIC_RGB_SERVER_URL = "https://webycash-rgb-prod.harmoniis.workers.dev"
PUBLIC_RGB_COLLECTIBLE_SERVER_URL = "https://webycash-rgb-collectible-prod.harmoniis.workers.dev"
# Default Arkade ASP, MAINNET (we do NOT operate it). Pins from GET https://arkade.computer/v1/info (v0.9.23, 2026-10-30)
PUBLIC_ARK_ENABLED = "true"
PUBLIC_ARK_NETWORK = "bitcoin"
PUBLIC_ARK_ASP_URL = "https://arkade.computer"
PUBLIC_ARK_SIGNER_PK_HEX = "8202bebddeb1f7442803897a85eaf3ce9254d07df0172fc3725ab5f0d097779c"
PUBLIC_ARK_INFO_DIGEST_HEX = "6f4148f0aafe75ff8046f314d75a87ddf17ad0659f37af55746498104fde3589"
PUBLIC_ARK_CHECKPOINT_TAPSCRIPT_HEX = "039e0440b27520b43a8363118c084a04d4f6a50ebfa58e81957f8cceceb2aee0ab64c9fd2d9977ac"
PUBLIC_ARK_UNILATERAL_EXIT_DELAY = "605184"
# Production MPC-ceremony profile and its VK fingerprints (extro-circuits
# circuits-mpc/MANIFEST @267a5f9; reproducible with ceremony/verify.sh).
PUBLIC_ZKP_PROFILE = "mpc-2026-10-31"
PUBLIC_ZKP_BEARER_VK_SHA256 = "7de9aac9e4e4e880d32eacb06c717c9c59f1d251ebc71de1daddbf76acd66220"
PUBLIC_ZKP_CONDITIONAL_VK_SHA256 = "084837739c4fa0c0e12a60da8aabb6d0fdf198d9ce7c443ce00bc27271710db2"
PUBLIC_ICE_SERVERS_JSON = '["stun:stun.l.google.com:19302","stun:stun.cloudflare.com:3478"]'
# Managed TURN: Cloudflare Realtime TURN credentials minted per runtime-config
# request (worker/turn-relay.mjs), never static; public Open Relay is refused
# on mainnet tiers. Secrets (never here):
#   wrangler secret put TURN_KEY_ID --config wrangler.staging.toml
#   wrangler secret put TURN_KEY_API_TOKEN --config wrangler.staging.toml
PUBLIC_TURN_PROVIDER = "cloudflare"
PUBLIC_TURN_TTL_SECONDS = "43200"

# Per-client-IP cap on TURN credential minting (Workers rate limiting).
[[ratelimits]]
name = "TURN_MINT_LIMITER"
namespace_id = "7001"
simple = { limit = 30, period = 60 }
