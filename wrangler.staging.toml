# MAINNET STAGING deploy (Cloudflare Worker + static assets; Workers only, no containers).
# Separate Worker + IndexedDB name from dev. Ark on Bitcoin MAINNET via the default
# Arkade ASP (arkade.computer; we do NOT operate it). Webcash legs on mainnet
# webcash.org. The runtime-config validator allows Ark mainnet ONLY for the
# `staging` tier; `development` stays blocked.
# Build with BASE_PATH=/wallet, nest output under staging-deploy/wallet/, then:
#   wrangler deploy --config wrangler.staging.toml
# Served at https://weby-wallet-pwa-staging.<account>.workers.dev/wallet (no DNS change).
name = "weby-wallet-pwa-staging"
main = "dev-worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
assets = { directory = "staging-deploy", binding = "ASSETS", run_worker_first = true }

[vars]
PUBLIC_BOOT_SCHEMA_VERSION = "2"
PUBLIC_DEPLOYMENT = "staging"
PUBLIC_EXTRO_DB_NAME = "extro-node-staging-mainnet"
PUBLIC_EXTRO_ADAPTER = "bundled"
PUBLIC_KEYSERVER_URL = "https://dev.extro.network"
PUBLIC_KEYSERVER_DOMAIN = "dev.extro.network"
PUBLIC_KEYSERVER_FINGERPRINT = "fe812c12f3ab4ce6ac5db69ac352f906cb1b11ef"
PUBLIC_KEYSERVER_VK = "ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c"
PUBLIC_REFEREE_URL = "https://dev.weby.cash/api/referee"
PUBLIC_REFEREE_VK = "a4af4b046664378c0d7a69a31be38be6dd0c8fce10a74273ea044c2b5cc8c11c"
PUBLIC_WEBCASH_SERVER_URL = "https://webcash.org"
PUBLIC_VOUCHER_SERVER_URL = "https://dev.weby.cash/api/voucher"
PUBLIC_RGB_SERVER_URL = "https://dev.weby.cash/api/rgb"
PUBLIC_RGB_COLLECTIBLE_SERVER_URL = "https://dev.weby.cash/api/rgb-collectible"
# Default Arkade ASP, MAINNET (we do NOT operate it). Pins from GET https://arkade.computer/v1/info (v0.9.23, 2026-10-30)
PUBLIC_ARK_ENABLED = "true"
PUBLIC_ARK_NETWORK = "bitcoin"
