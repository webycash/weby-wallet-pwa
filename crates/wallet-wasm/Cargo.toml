[package]
name = "wallet-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The one webcash wallet core; same rev as extro-node pins.
webylib = { git = "ssh://git@github.com/webycash/webylib.git", rev = "db2d6238623cab27279b95509db05b06861b4fc4", default-features = false, features = ["wasm"] }
# HD root, master slot registry, WebGPU miner + work-unit kernel.
extro-node = { git = "ssh://git@github.com/extronet/extro-node.git", rev = "f01e965df5361992695859ce7bc9ef14041ae544", default-features = false, features = ["wallet", "mining-webgpu"] }
zeroize = { version = "1", features = ["serde"] }
sha2 = "0.10"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
base64 = "0.22"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
